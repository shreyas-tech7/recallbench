name: Benchmark

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed for the benchmark (not 1, the tuning seed)"
        default: "5"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: ./init.sh
      - name: Run the benchmark
        env:
          SEED: ${{ inputs.seed }}
        run: .venv/bin/recallbench run --seed "$SEED" --out "results/ci-seed$SEED.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: results/ci-seed*.json
