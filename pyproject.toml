[project]
name = "recallbench"
version = "0.1.0rc1"
description = "Test how agent memory strategies keep, update and forget facts across many sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dense = ["fastembed>=0.4"]

[project.scripts]
recallbench = "recallbench.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recallbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
